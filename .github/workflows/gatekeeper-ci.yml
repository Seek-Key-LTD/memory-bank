name: SeekKey Gatekeeper & Memory Bank Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  timeline-lint:
    name: AGE Timeline Linter & Gatekeeper (ash3 runner)
    runs-on: [self-hosted, ash3]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
        continue-on-error: true

      - name: Run Age Timeline Linter
        run: |
          python3 scripts/age_timeline_linter.py schemas/memory_record.json
