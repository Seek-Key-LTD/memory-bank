name: Memory Bank Cognitive Pipeline

on:
  push:
    branches: [ "*" ]

jobs:
  run-demo-pipeline:
    runs-on: arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up executable permission
        run: chmod +x ./demo_memory_bank.py

      - name: Execute Pipeline Demonstration (Access -> Aggregation -> Core)
        run: python3 ./demo_memory_bank.py
